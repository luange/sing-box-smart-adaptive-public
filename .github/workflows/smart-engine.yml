name: Smart engine

on:
  push:
    paths:
      - "smart-engine/**"
      - "docs/smart-engine-architecture.md"
      - ".github/workflows/smart-engine.yml"
  pull_request:
    paths:
      - "smart-engine/**"
      - "docs/smart-engine-architecture.md"
      - ".github/workflows/smart-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig:
    name: Adaptive/eBPF Zig policy library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Test
        working-directory: smart-engine
        run: zig build test -Dcpu=baseline
      - name: Build release library
        working-directory: smart-engine
        run: zig build -Dcpu=baseline -Doptimize=ReleaseFast
      - name: Exercise adaptive/eBPF C ABI
        working-directory: smart-engine
        run: |
          cat > /tmp/smart_engine_abi.c <<'EOF'
          #include "smart_engine.h"
          int main(void) {
            if (adaptive_engine_abi_version() != 2) return 1;
            adaptive_engine_config cfg = {0};
            cfg.switch_margin = 0.15;
            adaptive_engine *engine = adaptive_engine_create(cfg);
            if (!engine) return 2;
            adaptive_candidate candidates[2] = {
              {.id = 1, .health_priority = 1, .weighted_delay_ms = 20, .supported = 1, .eligible = 1},
              {.id = 2, .health_priority = 2, .weighted_delay_ms = 10, .supported = 1, .eligible = 1},
            };
            adaptive_decision decision = adaptive_engine_choose(engine, candidates, 2, 0);
            adaptive_engine_destroy(engine);
            return decision.selected_id != 0 ? 0 : 3;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -I include /tmp/smart_engine_abi.c zig-out/lib/libsmart_engine.a -lm -o /tmp/smart_engine_abi
          /tmp/smart_engine_abi
      - name: Run Smart and transport regression tests
        run: |
          set -euo pipefail
          # Release-shaped profile: Go owns Smart; adaptive_zig is only for eBPF.
          CGO_ENABLED=1 go test -tags adaptive_zig ./protocol/group ./transport/v2raywebsocket
      - name: Cross-build Linux libraries
        working-directory: smart-engine
        run: |
          zig build -Dtarget=x86_64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseFast
          zig build -Dtarget=aarch64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseFast
      - name: Check C ABI header
        working-directory: smart-engine
        run: |
          printf '#include "smart_engine.h"\nint main(void) { return adaptive_engine_abi_version() == ADAPTIVE_ENGINE_ABI_VERSION ? 0 : 1; }\n' > /tmp/smart_engine_abi.c
          cc -std=c11 -Wall -Wextra -Werror -I include -c /tmp/smart_engine_abi.c -o /tmp/smart_engine_abi.o
